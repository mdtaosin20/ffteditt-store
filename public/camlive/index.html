<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Camera live</title>
<style>
html,body{margin:0;height:100%;background:#05070f;overflow:hidden;font-family:Arial,sans-serif}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;transition:opacity .4s}
#v.on{opacity:1}
#wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;
  background:radial-gradient(120% 70% at 50% 20%,#3a1030 0%,#130d26 55%,#05070f 100%)}
#wait .dot{width:5vmin;height:5vmin;border-radius:50%;background:#ff2d55;box-shadow:0 0 4vmin #ff2d55;animation:b 1.2s infinite}
#wait h1{font-size:7vmin;margin:3vmin 0 1vmin;letter-spacing:.5vmin}
#wait p{font-size:3.6vmin;color:#c7cbe0;margin:0}
@keyframes b{50%{opacity:.25}}
</style></head>
<body>
<div id="wait"><div class="dot"></div><h1>LIVE STARTING SOON</h1><p id="who"></p></div>
<video id="v" autoplay playsinline muted></video>
<audio id="a" autoplay></audio>
<script type="module" src="camlive.js?v=1"></script>
</body></html>
