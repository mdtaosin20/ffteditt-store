<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Flag Battle · 195 Countries, 1 Champion</title>
<link rel="stylesheet" href="/flags/flags.css?v=1">
</head>
<body>
<div id="stage">
  <!-- top: qualified list + numbers -->
  <section class="panel qual">
    <h2 id="qual-title">QUALIFIED FOR FINAL</h2>
    <div id="qual-rows"></div>
  </section>
  <section class="panel stats">
    <div class="k" id="st-k1">ROUND</div><div class="v" id="st-round">1</div>
    <div class="k">QUALIFIED</div><div class="v"><b id="st-qual">0</b> / <span id="st-target">70</span></div>
    <div class="k" id="st-k3">SPOTS LEFT</div><div class="v last" id="st-left">70</div>
  </section>

  <div class="timer" id="timer">FINAL IN <b>--:--</b></div>
  <div class="feed" id="feed"></div>

  <canvas id="arena" aria-label="Flags bouncing inside a turning ring"></canvas>

  <div class="bar"><i id="bar"></i></div>
  <div class="left" id="left">195 / 195 FLAGS LEFT</div>
  <div class="grid" id="grid" aria-hidden="true"></div>

  <footer class="foot">
    <div class="r" id="foot-r">ROUND 1 · 70 SPOTS LEFT</div>
    <h1 id="title">COUNTRY FLAG BATTLE</h1>
    <div class="m" id="foot-m">ROUND 1 · QUALIFYING</div>
  </footer>

  <div class="banner" id="banner" hidden><div class="banner-in" id="banner-text">ROUND 1</div></div>

  <div class="win" id="win" hidden>
    <div class="win-in">
      <div class="crown" id="win-crown" aria-hidden="true">♛</div>
      <div class="t" id="win-t">ROUND WINNER</div>
      <div class="flag big" id="win-flag"></div>
      <div class="c" id="win-name">SWEDEN</div>
      <div class="q2" id="win-sub">QUALIFIED #13 / 70</div>
    </div>
  </div>

  <div class="caption" id="caption" hidden>
    <div class="mic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <div class="caption-text" id="caption-text"></div>
  </div>

  <button class="sound-btn" id="sound-btn" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    TAP FOR SOUND
  </button>
</div>
<script type="module" src="/flags/flags.js?v=1"></script>
</body>
</html>
