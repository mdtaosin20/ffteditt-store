<!doctype html>
<html lang="en">
<head>
<script src="/game/fpscap.js?v=3"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cup Kick · Which flag touches the cup?</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cup Kick">
<link rel="manifest" href="/cupkick/manifest.json">
<link rel="icon" href="/cupkick/icon-192.png">
<link rel="apple-touch-icon" href="/cupkick/icon-180.png">
<link rel="stylesheet" href="/cupkick/cupkick.css?v=9">
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="words st-classic" id="words"><div class="wbox">
    <div class="w1" id="w1">Watch closely! 👀</div>
    <div class="w2" id="w2">Which country touches the cup? 🏆</div>
  </div></div>
  <div class="wm" id="wm"></div>
  <div class="tap" id="tap" hidden>tap the screen for the menu</div>
</div>

<div class="menu" id="menu">
  <div class="card">
    <h1>⚽ CUP KICK</h1>
    <p class="muted">Pick the countries and press START. Then record your screen. Tap the screen any time for this menu.</p>
    <label class="row"><span>How many players</span><select id="np"><option value="6">6 players</option><option value="5">5 players</option><option value="4">4 players</option><option value="3">3 players</option><option value="2">2 players</option></select></label>
    <div class="teams" id="teams"></div>
    <label class="row"><span>Whose ball touches the cup?</span><select id="win"></select></label>
    <div class="ctl">
      <div class="ctl-h">🎛 CONTROL</div>
      <label class="row"><span>Ball speed: <b id="speedV">Normal (1.0×)</b></span>
        <input type="range" id="speed" min="0.6" max="1.6" step="0.1" value="1">
        <span class="ends"><i>🐢 Slow</i><i>🚀 Fast</i></span></label>
      <label class="row"><span>All players kick within: <b id="withinV">2 seconds</b></span>
        <input type="range" id="within" min="1" max="6" step="0.5" value="2">
        <span class="ends"><i>1 s (all together)</i><i>6 s (one by one)</i></span></label>
      <label class="row"><span>⚽ Kick sound (ball hits): <b id="kvolV">100%</b></span>
        <input type="range" id="kvol" min="0" max="3" step="0.1" value="1">
        <span class="ends"><i>🔇 Off</i><i>🔊 Very loud (300%)</i></span></label>
      <label class="row"><span>How messy (balls crash into each other)</span>
        <select id="mess"><option value="0">Calm</option><option value="1">Normal</option><option value="2">Wild 🔥 (hard to guess)</option><option value="3">Very hard 🔥🔥 (watch it again!)</option><option value="4" selected>Extreme 🔥🔥🔥 (watch it 3–4 times!)</option></select></label>
      <label class="row"><span>Player size</span>
        <select id="size"><option value="1">Now (normal)</option><option value="1.4">Bigger (1.4×)</option><option value="1.7">Biggest (1.7×)</option></select></label>
      <div class="cam">
        <label class="cam-h"><input type="checkbox" id="camOn"> 📷 Camera &amp; field <span class="cam-sw"></span></label>
        <div id="camBody" hidden>
        <div class="cam-r"><button type="button" id="camReset" class="ghost">↺ Normal</button></div>
        <label class="row"><span>See more of the sides (wider view): <b id="camfovV"></b></span>
          <input type="range" id="camfov" min="50" max="72" step="1" value="50">
          <span class="ends"><i>Normal</i><i>Much wider</i></span></label>
        <label class="row"><span>Camera forward / back: <b id="camzV"></b></span>
          <input type="range" id="camz" min="-4" max="6" step="0.5" value="0">
          <span class="ends"><i>⬆ Closer</i><i>Further back ⬇</i></span></label>
        <label class="row"><span>Camera up / down: <b id="camyV"></b></span>
          <input type="range" id="camy" min="-1.5" max="3" step="0.25" value="0">
          <span class="ends"><i>Lower</i><i>Higher</i></span></label>
        <label class="row"><span>Space between players: <b id="gapV"></b></span>
          <input type="range" id="gap" min="0.2" max="1.4" step="0.1" value="0.2">
          <span class="ends"><i>Normal</i><i>Far apart</i></span></label>
        </div>
      </div>
      <div class="cam">
        <label class="cam-h"><input type="checkbox" id="cupOn"> 🏆 Trophy <span class="cam-sw"></span></label>
        <label class="row" style="margin-top:8px"><span>Trophy design (the middle)</span>
          <select id="neck"><option value="A">💎 A · Golden ring with red gems</option><option value="B">🪽 B · Golden wings</option><option value="C">⭐ C · Golden star with pearls</option><option value="none">Plain (just closed)</option></select></label>
        <div id="cupBody" hidden>
        <div class="cam-r"><button type="button" id="cupReset" class="ghost">↺ Normal</button></div>
        <label class="row"><span>Forward / back: <b id="cupzV"></b></span>
          <input type="range" id="cupz" min="-6" max="2" step="0.5" value="0">
          <span class="ends"><i>Nearer to the players</i><i>Nearer to you</i></span></label>
        <label class="row"><span>Left / right: <b id="cupxV"></b></span>
          <input type="range" id="cupx" min="-2.5" max="2.5" step="0.25" value="0">
          <span class="ends"><i>⬅ Left</i><i>Right ➡</i></span></label>
        <label class="row"><span>Size: <b id="cupsV"></b></span>
          <input type="range" id="cups" min="0.7" max="2" step="0.1" value="1">
          <span class="ends"><i>Smaller</i><i>Bigger (2×)</i></span></label>
        </div>
      </div>
      <label class="row"><span>Ball size</span>
        <select id="ball"><option value="0.38">Small</option><option value="0.45" selected>A little bigger</option><option value="0.52">Big</option></select></label>
      <label class="row"><span>Ball colours</span>
        <select id="bcol"></select></label>
      <label class="row"><span>Channel name (watermark — leave empty for none)</span>
        <input id="chan" maxlength="30" placeholder="@YourChannel"></label>
      <label class="row"><span>Place</span>
        <select id="place"><option value="night">🌙 Night stadium</option><option value="day">☀️ Day stadium</option><option value="sunset">🌅 Sunset stadium</option><option value="beach">🏖 Beach</option><option value="snow">❄️ Snow</option><option value="street">🏙 Street court</option><option value="rand">🎲 New stadium every START (unlimited)</option></select><small id="lookInfo" style="display:block;margin-top:4px;font-size:12px;color:#9fb0d6"></small></label>
      <label class="row"><span>Picture quality</span>
        <select id="quality"><option value="normal">Normal (smooth on every phone)</option><option value="sharp">Sharp ✨ (full phone resolution, for HD/4K recording)</option></select></label>
      <label class="row chk"><input type="checkbox" id="grass3d"> 🌱 3D grass (more real — turn it off if the phone gets slow)</label>
    </div>
    <label class="row"><span>Text style (the two lines at the top)</span>
      <select id="tstyle">
        <option value="classic">Classic (as before)</option>
        <option value="A">A · Gold 3D + red ribbon</option>
        <option value="B">B · Glossy bubble + yellow capsule</option>
        <option value="C">C · E-sports neon</option>
        <option value="D">D · Comic burst</option>
        <option value="E">E · Stickers</option>
        <option value="F">F · Fire 🔥</option>
        <option value="G">G · Glass card</option>
        <option value="H">H · Trophy gold ✨</option>
        <option value="I">I · Red button</option>
        <option value="J">J · Rainbow shadow 🌈</option>
        <option value="K">K · Scoreboard</option>
        <option value="L">L · Pink-purple bubble</option>
        <option value="off">Off — no text on the video</option>
      </select></label>
    <p class="small muted">Leave a text box empty to hide just that line.</p>
    <label class="row"><span>Top text</span><input id="t1" maxlength="40" value="Watch closely! 👀"></label>
    <label class="row"><span>Question</span><input id="t2" maxlength="44" value="Which country touches the cup? 🏆"></label>
    <label class="row"><span>Text at the end</span><input id="t3" maxlength="44" value="Comment below 👇"></label>
    <label class="row chk"><input type="checkbox" id="snd" checked> Sound</label>
    <label class="row chk"><input type="checkbox" id="loop"> 🔁 Loop video (the end goes back to the start — no jump when Shorts plays it again)</label>
    <div class="btns"><button id="go" type="button">▶ START</button><button id="shuffle" type="button" class="ghost">🎲 Random countries</button></div>
    <div class="app" id="app">
      <button id="install" type="button" class="ghost" hidden>📲 Install as app</button>
      <p class="small muted" id="apphelp"></p>
    </div>
    <p class="small muted" id="answer"></p>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "/game/vendor/three.module.js" } }</script>
<script type="module" src="/cupkick/cupkick.js?v=42"></script>
</body>
</html>
